unit(){const s=CV.unit;
 const contrib=s.arpu*s.marge/100, vida=100/s.churn, ltv=contrib*vida;
 const pay=contrib>0?s.cac/contrib:Infinity, ratio=s.cac>0?ltv/s.cac:0;
 const cum=[];let acc=-s.cac;cum.push(acc);
 for(let m=1;m<=36;m++){acc+=contrib*Math.pow(1-s.churn/100,m);cum.push(acc);}
 const sa=ratio>=3&&pay<=12;
 return '<div class="kpis">'+
  '<div class="kpi"><small>Contribució per client i mes</small><strong>'+E(contrib)+'</strong></div>'+
  '<div class="kpi"><small>Vida mitjana del client</small><strong>'+nf1.format(vida)+' mesos</strong></div>'+
  '<div class="kpi"><small>LTV (sobre marge)</small><strong>'+E(ltv)+'</strong></div>'+
  '<div class="kpi"><small>LTV / CAC</small><strong class="'+(ratio>=3?'pos':'neg')+'">'+nf1.format(ratio)+'×</strong></div>'+
  '<div class="kpi wide"><small>Període de recuperació del CAC</small><strong class="'+(pay<=12?'pos':'neg')+'">'+
   (isFinite(pay)?nf1.format(pay)+" mesos":"mai")+'</strong></div></div>'+
  legend([{c:"#A0431E",l:"Contribució acumulada per client (36 mesos)"}])+
  chart([{v:cum,color:"#A0431E",fill:true}],{xlab:["captació","mes 36"]})+
  '<p class="verdict">'+(sa?'Els números tanquen: ràtio per damunt de 3× i recuperació per sota de 12 mesos, que són les referències habituals.':
   'Aquests números <b>no tanquen</b>: '+(ratio<3?'la ràtio LTV/CAC és inferior a 3× ':'')+(pay>12?'i el CAC triga més d\'un any a recuperar-se':'')+'. ')+
  ' La corba creua el zero quan el client ja ha pagat el que va costar captar-lo. Fixa\'t que l\'LTV es calcula sobre MARGE, no sobre ingrés: '+
  'fer-ho sobre ingrés és l\'error més comú i infla el resultat un '+nf1.format(100/(s.marge/100)-100)+'%. '+
  'Prova de moure només el churn: és la variable que més mou el resultat, i és la que menys es toca.</p>';},
van(){const s=CV.van;
 let van=-s.inv;const cum=[-s.inv];
 for(let y=1;y<=s.anys;y++){van+=s.flux/Math.pow(1+s.taxa/100,y);cum.push(van);}
 let tir=null;
 for(let r=0;r<=200;r+=0.1){let v=-s.inv;for(let y=1;y<=s.anys;y++)v+=s.flux/Math.pow(1+r/100,y);
  if(v<0){tir=r;break;}}
 const pay=s.flux>0?s.inv/s.flux:Infinity;
 return '<div class="kpis">'+
  '<div class="kpi"><small>VAN</small><strong class="'+(van>=0?'pos':'neg')+'">'+E(van)+'</strong></div>'+
  '<div class="kpi"><small>TIR aproximada</small><strong>'+(tir!==null?nf1.format(tir)+"%":"—")+'</strong></div>'+
  '<div class="kpi wide"><small>Recuperació simple (sense descomptar)</small><strong>'+
   (isFinite(pay)?nf1.format(pay)+" anys":"mai")+'</strong></div></div>'+
  legend([{c:"#5B3E86",l:"VAN acumulat any a any"}])+
  chart([{v:cum,color:"#5B3E86",fill:true}],{xlab:["inversió","any "+s.anys]})+
  '<p class="verdict">'+(van>=0?'Amb una taxa del '+P(s.taxa)+' el projecte <b>crea valor</b>.':
   'Amb una taxa del '+P(s.taxa)+' el projecte <b>destrueix valor</b>: els fluxos no compensen el risc i el cost del capital.')+
  ' La TIR ronda el '+(tir!==null?nf1.format(tir)+"%":"—")+', o sigui que el projecte aguanta fins a aquesta taxa de descompte. '+
  'Mou la taxa i observa com de fràgil és la conclusió: qui tria la taxa de descompte, tria el resultat. '+
  'I recorda que la TIR ignora l\'escala — un percentatge alt sobre poc diner pot valer menys que un de modest sobre molt.</p>';},
palanc(){const s=CV.palanc;
 const mc=s.preu-s.cvar, contrib=mc*s.uds, ben=contrib-s.fix;
 const bep=mc>0?Math.ceil(s.fix/mc):Infinity;
 const gao=ben!==0?contrib/ben:Infinity;
 const nouBen=mc*s.uds*(1+s.delta/100)-s.fix;
 const varBen=ben!==0?(nouBen-ben)/Math.abs(ben)*100:0;
 const cum=[];for(let i=0;i<=20;i++){const u=Math.max(1,Math.round(bep*2*i/20));cum.push(mc*u-s.fix);}
 return '<div class="kpis">'+
  '<div class="kpi"><small>Marge de contribució unitari</small><strong>'+E(mc)+'</strong></div>'+
  '<div class="kpi"><small>Punt d\'equilibri</small><strong>'+(isFinite(bep)?nf.format(bep)+" clients":"—")+'</strong></div>'+
  '<div class="kpi"><small>Benefici actual</small><strong class="'+(ben>=0?'pos':'neg')+'">'+E(ben)+'</strong></div>'+
  '<div class="kpi"><small>Grau de palanquejament</small><strong>'+(isFinite(gao)?nf1.format(gao)+"×":"—")+'</strong></div>'+
  '<div class="kpi wide"><small>Si les vendes varien un '+(s.delta>0?"+":"")+nf1.format(s.delta)+'%, el benefici varia</small><strong class="'+
   (varBen>=0?'pos':'neg')+'">'+(varBen>0?"+":"")+nf1.format(varBen)+'%</strong></div></div>'+
  legend([{c:"#14663F",l:"Benefici segons nombre de clients"}])+
  chart([{v:cum,color:"#14663F"}],{xlab:["0 clients",nf.format(bep*2)+" clients"]})+
  '<p class="verdict">El grau de palanquejament operatiu de <b>'+(isFinite(gao)?nf1.format(gao)+"×":"—")+'</b> vol dir que cada 1% de variació en vendes es converteix en un '+
  (isFinite(gao)?nf1.format(gao):"—")+'% de variació en el benefici. És la mateixa amplificació en les dues direccions: '+
  'l\'estructura que et fa guanyar molt quan puges és la que t\'esfondra quan baixes. '+
  'Puja els costos fixos i mira com el grau creix — aquesta és la decisió real que hi ha darrere de contractar plantilla en comptes de subcontractar.</p>';},
dilu(){const s=CV.dilu;
 const post=s.pre+s.inv;
 const pctInv=post>0?s.inv/post*100:0;
 const pctFund=Math.max(0,100-pctInv-s.pool);
 const pref=s.inv*s.pref;
 let invGets, fundGets;
 if(s.exit<=pref){invGets=s.exit;}
 else{invGets=pref+(s.exit-pref)*pctInv/100;}
 invGets=Math.min(invGets,s.exit);
 fundGets=(s.exit-invGets)*(pctFund/(pctFund+s.pool||1));
 const sensePref=s.exit*pctInv/100;
 const cost=invGets-sensePref;
 return '<div class="kpis">'+
  '<div class="kpi"><small>Valoració post-money</small><strong>'+E(post)+'</strong></div>'+
  '<div class="kpi"><small>% inversor</small><strong>'+nf1.format(pctInv)+'%</strong></div>'+
  '<div class="kpi"><small>% fundadors (després del pool)</small><strong>'+nf1.format(pctFund)+'%</strong></div>'+
  '<div class="kpi"><small>Preferència garantida</small><strong>'+E(pref)+'</strong></div>'+
  '<div class="kpi"><small>L\'inversor s\'emporta</small><strong class="neg">'+E(invGets)+'</strong></div>'+
  '<div class="kpi"><small>Els fundadors s\'emporten</small><strong class="'+(fundGets>0?'pos':'neg')+'">'+E(fundGets)+'</strong></div>'+
  '</div>'+
  '<p class="verdict">En una venda de '+E(s.exit)+', l\'inversor s\'emporta <b>'+E(invGets)+'</b> — '+
  (cost>1?'és a dir <b>'+E(cost)+' més</b> del que li correspondria pel seu '+nf1.format(pctInv)+'% (que serien '+E(sensePref)+'). '+
   'Aquesta diferència la paguen íntegrament els fundadors.':'exactament el que li correspon pel seu percentatge, perquè la venda és prou gran perquè la preferència no s\'activi de manera rellevant.')+
  ' Baixa la preferència a 1× i mira la diferència: negociar aquesta condició sol valer molt més que negociar la valoració. '+
  'I fixa\'t en el pool: aquest '+nf1.format(s.pool)+'% creat abans de la inversió el paguen només els fundadors — és una rebaixa encoberta de la valoració.</p>';},
esper(){const s=CV.esper;
 const p=s.prob/100, rec=s.cost*s.recup/100;
 const ev=p*s.guany+(1-p)*rec-s.cost;
 const perdua=s.cost-rec;
 const pct=s.caixa>0?perdua/s.caixa*100:0;
 const pStar=(s.guany-rec)!==0?(s.cost-rec)/(s.guany-rec)*100:100;
 const curve=[];for(let x=0;x<=100;x+=2)curve.push((x/100)*s.guany+(1-x/100)*rec-s.cost);
 const mi=Math.round(s.prob/2);
 const ruina=pct>=60;
 return '<div class="kpis">'+
  '<div class="kpi"><small>Valor esperat</small><strong class="'+(ev>=0?'pos':'neg')+'">'+(ev>0?"+":"")+E(ev)+'</strong></div>'+
  '<div class="kpi"><small>Probabilitat mínima per a EV positiu</small><strong>'+nf1.format(pStar)+'%</strong></div>'+
  '<div class="kpi"><small>Pèrdua real si surt malament</small><strong class="neg">'+E(perdua)+'</strong></div>'+
  '<div class="kpi"><small>Sobre la teva caixa</small><strong class="'+(ruina?'neg':'')+'">'+nf1.format(pct)+'%</strong></div>'+
  '</div>'+
  legend([{c:"#40506B",l:"Valor esperat segons la probabilitat d'èxit"}])+
  chart([{v:curve,color:"#40506B",fill:true}],{marker:{i:mi,v:curve[mi],color:"#40506B"},xlab:["0% d'èxit","100% d'èxit"]})+
  '<p class="verdict">'+(ev>=0
   ? 'El valor esperat és positiu: amb aquestes xifres, l\'aposta compensa <b>en mitjana</b>. Necessites almenys un '+nf1.format(pStar)+'% de probabilitat d\'èxit perquè surti a compte.'
   : 'El valor esperat és negatiu: caldria una probabilitat d\'èxit superior al <b>'+nf1.format(pStar)+'%</b> perquè compensés.')+
  ' '+(ruina
   ? '<b>Però atenció al que el càlcul no diu:</b> si surt malament perds el '+nf1.format(pct)+'% de la teva caixa. A aquest nivell no hi ha segona tirada, i el valor esperat només té sentit si pots repetir l\'aposta moltes vegades. Una aposta amb EV positiu que et pot deixar fora del joc no és una bona aposta: és una aposta que no et pots permetre.'
   : 'Si surt malament perds el '+nf1.format(pct)+'% de la caixa, un cop assumible: podries tornar a intentar-ho, que és el que fa que el valor esperat sigui un criteri vàlid aquí.')+
  ' Contrasta sempre la teva probabilitat estimada amb la taxa base de casos comparables: la visió interior sol ser molt més optimista que les dades del sector.</p>';},
mult(){const s=CV.mult;
 const val=s.arr*s.mult;
 const baix=s.arr*Math.max(0.5,s.mult*0.6), alt=s.arr*s.mult*1.6;
 const proj=[];let a=s.arr;proj.push(a);
 for(let y=1;y<=5;y++){a=a*(1+s.creix/100);proj.push(a);}
 const regla40=s.creix;
 return '<div class="kpis">'+
  '<div class="kpi"><small>Valoració estimada</small><strong>'+E(val)+'</strong></div>'+
  '<div class="kpi"><small>Rang realista de mercat</small><strong style="font-size:14px">'+E(baix)+' – '+E(alt)+'</strong></div>'+
  '<div class="kpi wide"><small>ARR projectat d\'aquí 5 anys al '+nf1.format(s.creix)+'% anual</small><strong>'+E(proj[5])+'</strong></div>'+
  '</div>'+
  legend([{c:"#1F4E79",l:"Projecció d'ARR a 5 anys"}])+
  chart([{v:proj,color:"#1F4E79",fill:true}],{xlab:["avui","any 5"]})+
  '<p class="verdict">Un múltiple de '+nf1.format(s.mult)+'× sobre '+E(s.arr)+' dona '+E(val)+'. Però el rang de mercat per a la mateixa empresa pot anar de '+E(baix)+' a '+E(alt)+
  ' segons el moment del cicle, el churn i qui compra: el 2021 i el 2023 tenien múltiples radicalment diferents per a empreses idèntiques. '+
  'Amb un creixement del '+nf1.format(regla40)+'%, la conversa amb un inversor girarà sobretot al voltant de si aquest ritme és sostenible i a quin cost de captació. '+
  'El número concret importa menys que entendre què el mou.</p>';}
};
function renderCalc(){
 let o='<div class="narrow"><p class="lead">Les eines numèriques que es fan servir de veritat en una escola de negocis. Mou els controls i mira com canvien les conclusions.</p>';
 Object.keys(CDEF).forEach(k=>{const d=CDEF[k];
  o+=`<section class="calc" style="--c:${d.c}"><h3>${d.n} · ${esc(d.t)}</h3><p class="clead">${esc(d.lead)}</p>`;
  d.ctrls.forEach(c=>{o+=`<div class="ctrl"><div class="lab"><span>${esc(c.l)}</span><b id="v-${k}-${c.p}"></b></div>
   <input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${CV[k][c.p]}" data-calc="${k}" data-p="${c.p}" aria-label="${esc(c.l)}"></div>`;});
  o+=`<div class="out" id="out-${k}"></div></section>`;});
 return o+'</div>';
}
function refreshCalc(k){const d=CDEF[k];
 d.ctrls.forEach(c=>{const el=document.getElementById("v-"+k+"-"+c.p);if(el)el.textContent=fmtVal(c.f,CV[k][c.p]);});
 const b=document.getElementById("out-"+k);if(b)b.innerHTML=CUPD[k]();}
function refreshAllCalc(){Object.keys(CDEF).forEach(refreshCalc);}

/* ---------- DIAGNÒSTIC ---------- */
function renderDiag(){
 let o='<div class="narrow"><p class="lead">Aquí no hi ha opcions. Se\'t donen les dades d\'una empresa i has de dir què li passa. Escriu-ho primer i després compara amb l\'anàlisi completa: és l\'exercici que més s\'assembla a un examen de cas.</p>';
 DIAG.forEach((d,i)=>{
  o+=`<section class="diag"><h3>${esc(d.t)}</h3><p class="set" style="font-size:15px;line-height:1.65;margin:0 0 13px">${esc(d.intro)}</p>`;
  o+='<table class="tbl">'+d.rows.map(r=>`<tr class="${r[0]==="h"?"h":""}"><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")+'</table>';
  o+=`<label>Què li passa a aquesta empresa? Escriu el teu diagnòstic abans de mirar</label>
   <textarea rows="4" data-dn="${i}" placeholder="Ex.: el problema real és…">${esc(dnotes[i]||"")}</textarea>
   <div style="margin-top:12px"><button class="btn ${diagOpen[i]?'ghost':''}" data-diag="${i}">${diagOpen[i]?"Amaga l'anàlisi":"Veure l'anàlisi completa"}</button></div>`;
  if(diagOpen[i])o+='<div class="analysis open">'+d.points.map(p=>`<p>${esc(p)}</p>`).join("")+'</div>';
  o+='</section>';});
 return o+'</div>';
}

/* ---------- RENDER ---------- */
function render(){
 const v=document.getElementById("view");
 v.innerHTML = tab==="moduls"?renderMods() : tab==="cas"?renderCase() : tab==="calc"?renderCalc() : renderDiag();
 if(tab==="calc")refreshAllCalc();
}
document.getElementById("view").addEventListener("click",e=>{
 const t=e.target;
 const m=t.closest("[data-mod]"); if(m){modOpen[m.dataset.mod]=!modOpen[m.dataset.mod];render();return;}
 const cse=t.closest("[data-case]"); if(cse){caseSel=cse.dataset.case;store.set("caseSel",caseSel);render();window.scrollTo(0,0);return;}
 const p=t.closest("[data-pick]"); if(p){picks[p.dataset.pick]=+p.dataset.k;store.set("picks",picks);render();return;}
 const a=t.closest("[data-an]"); if(a){anOpen[a.dataset.an]=!anOpen[a.dataset.an];render();return;}
 const d=t.closest("[data-diag]"); if(d){diagOpen[d.dataset.diag]=!diagOpen[d.dataset.diag];render();return;}
});
document.getElementById("view").addEventListener("input",e=>{
 const ta=e.target.closest("[data-dn]"); if(ta){dnotes[ta.dataset.dn]=ta.value;store.set("dnotes",dnotes);return;}
 const sl=e.target.closest("input[data-calc]");
 if(sl){CV[sl.dataset.calc][sl.dataset.p]=parseFloat(sl.value);refreshCalc(sl.dataset.calc);}
});
renderTabs();render();
</script>
</body>
</html>
